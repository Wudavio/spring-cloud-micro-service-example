# 微服務 OpenTelemetry Agent 自監控配置
# 用於監控 Java Agent 本身的效能和健康狀況

# 啟用 JMX 指標收集 - 監控 OpenTelemetry Agent
otel.instrumentation.jmx.enabled=true
otel.jmx.target.system=jvm

# 啟用 JVM 指標
otel.instrumentation.runtime-telemetry.enabled=true
otel.instrumentation.runtime-telemetry-java8.enabled=true

# 啟用 OpenTelemetry SDK 自監控指標
otel.sdk.disabled=false
otel.experimental.sdk.enabled=true

# 配置自監控指標導出
otel.metrics.exporter=otlp
otel.metric.export.interval=30000

# 配置 OpenTelemetry Agent 自身的資源屬性
otel.resource.attributes.extra=\
  otel.agent.version=1.32.0,\
  otel.agent.enabled=true,\
  monitoring.type=self-monitoring

# 啟用特定的儀表化以監控 Agent 效能
otel.instrumentation.opentelemetry-api.enabled=true
otel.instrumentation.opentelemetry-instrumentation-api.enabled=true

# 配置批次處理器自監控
otel.bsp.schedule.delay=500
otel.bsp.max.queue.size=2048
otel.bsp.max.export.batch.size=512
otel.bsp.export.timeout=30000

# 配置指標處理器自監控
otel.metric.export.interval=30000
otel.metric.export.timeout=30000

# 啟用 Agent 健康檢查指標
otel.javaagent.experimental.initializer.jar=
otel.javaagent.experimental.extensions=

# 配置記憶體使用監控
otel.instrumentation.jvm-metrics.enabled=true

# 配置 GC 監控
otel.instrumentation.gc.enabled=true

# 配置執行緒監控
otel.instrumentation.thread.enabled=true

# 配置類別載入監控
otel.instrumentation.classloader.enabled=true

# 啟用 Agent 錯誤追蹤
otel.javaagent.debug=false
otel.javaagent.experimental.log-telemetry=true

# 配置 Agent 效能監控
otel.experimental.metrics.cardinality.limit=2000
otel.experimental.resource.disabled-keys=

# 配置 Agent 自監控標籤
otel.resource.attributes.service.name.extra=otel-agent-monitor
otel.resource.attributes.service.version.extra=1.0.0

# 啟用實驗性功能以獲得更詳細的監控
otel.experimental.span-attributes=true
otel.experimental.log-attributes=true