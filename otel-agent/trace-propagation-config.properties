# 跨服務追蹤關聯統一配置檔案
# 此檔案定義了微服務間追蹤上下文傳播的統一設定

# 追蹤傳播器配置
# 支援多種傳播格式以確保與不同系統的相容性
otel.propagators=tracecontext,baggage,b3,b3multi,jaeger,ottrace
# 預設使用 W3C Trace Context 和 Baggage（最標準的格式）
otel.propagators.default=tracecontext,baggage

# HTTP 標頭傳播配置
# 客戶端請求標頭（發送到下游服務時包含的標頭）
otel.instrumentation.http.capture-headers.client.request=traceparent,tracestate,baggage,x-trace-id,x-span-id,x-correlation-id,x-request-id
# 客戶端響應標頭（從下游服務接收時捕獲的標頭）
otel.instrumentation.http.capture-headers.client.response=x-trace-id,x-span-id,x-correlation-id,x-request-id
# 伺服器請求標頭（從上游服務接收時捕獲的標頭）
otel.instrumentation.http.capture-headers.server.request=traceparent,tracestate,baggage,x-trace-id,x-span-id,x-correlation-id,x-request-id,user-agent,x-forwarded-for
# 伺服器響應標頭（發送給上游服務時包含的標頭）
otel.instrumentation.http.capture-headers.server.response=x-trace-id,x-span-id,x-correlation-id,x-request-id

# 服務間通信儀表化配置
# Spring 相關的 HTTP 客戶端
otel.instrumentation.resttemplate.enabled=true
otel.instrumentation.spring-web.enabled=true
otel.instrumentation.spring-webflux.enabled=true
otel.instrumentation.reactor-netty.enabled=true

# Apache HTTP 客戶端
otel.instrumentation.apache-httpclient.enabled=true
otel.instrumentation.apache-httpasyncclient.enabled=true

# OkHttp 客戶端
otel.instrumentation.okhttp.enabled=true

# Netty 相關
otel.instrumentation.netty.enabled=true

# OpenFeign 聲明式客戶端
otel.instrumentation.openfeign.enabled=true

# Spring Cloud 相關
otel.instrumentation.spring-cloud-gateway.enabled=true
otel.instrumentation.spring-cloud.enabled=true

# 追蹤上下文注入配置
# 自動將追蹤資訊注入到日誌中
otel.instrumentation.logback-appender.enabled=true
otel.instrumentation.log4j-appender.enabled=true

# 追蹤 Span 屬性配置
# HTTP 方法白名單
otel.instrumentation.http.known-methods=GET,POST,PUT,DELETE,PATCH,HEAD,OPTIONS,TRACE

# 捕獲 HTTP 標頭
otel.instrumentation.http.capture-request-headers=true
otel.instrumentation.http.capture-response-headers=true

# 服務發現和負載均衡
# Eureka 客戶端儀表化
otel.instrumentation.spring-cloud-eureka.enabled=true

# 資料庫連接池追蹤
otel.instrumentation.hikaricp.enabled=true

# 快取系統追蹤
otel.instrumentation.jedis.enabled=true
otel.instrumentation.lettuce.enabled=true

# 訊息佇列追蹤（如果使用）
otel.instrumentation.rabbitmq.enabled=true
otel.instrumentation.kafka.enabled=true

# 安全性配置
# Spring Security 儀表化
otel.instrumentation.spring-security.enabled=true

# 錯誤處理和重試
# 確保追蹤上下文在重試時保持一致
otel.instrumentation.spring-retry.enabled=true

# 異步處理
# 確保追蹤上下文在異步操作中正確傳播
otel.instrumentation.executor.enabled=true
otel.instrumentation.completablefuture.enabled=true

# 調度任務
otel.instrumentation.spring-scheduling.enabled=true

# 追蹤取樣配置
# 確保跨服務追蹤的一致性
otel.traces.sampler.parent_based=true

# Baggage 配置
# 定義可以跨服務傳播的業務上下文
otel.baggage.propagation.enabled=true

# 追蹤 ID 生成配置
# 使用隨機生成器確保唯一性
otel.traces.id.generator=random

# 資源屬性傳播
# 確保服務資訊在追蹤中正確標識
otel.resource.attributes.service.name.required=true
otel.resource.attributes.service.version.required=true
otel.resource.attributes.service.namespace.required=true