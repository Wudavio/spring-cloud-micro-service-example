# OpenTelemetry Java Agent 統一配置檔案
# 此檔案定義了所有微服務的 OpenTelemetry 配置

# 基本服務配置
# OTEL_SERVICE_NAME 將在每個服務的環境變數中單獨設定

# 資源屬性
otel.resource.attributes=deployment.environment=production,service.version=1.0.0

# 導出器配置
otel.exporter.otlp.endpoint=http://otel-collector:4327
otel.exporter.otlp.protocol=grpc

# 指標配置
otel.metrics.exporter=otlp
otel.metric.export.interval=15000
otel.metric.readers=periodic
otel.instrumentation.micrometer.enabled=true

# JVM 指標詳細配置
otel.instrumentation.runtime-telemetry.enabled=true
otel.instrumentation.runtime-telemetry-java8.enabled=true
otel.instrumentation.runtime-telemetry.emit-experimental-telemetry=true

# HTTP 指標配置
otel.instrumentation.http.capture-headers.client.request=content-type,user-agent
otel.instrumentation.http.capture-headers.client.response=content-type
otel.instrumentation.http.capture-headers.server.request=content-type,user-agent
otel.instrumentation.http.capture-headers.server.response=content-type

# 追蹤配置
otel.traces.exporter=otlp
otel.traces.sampler=traceidratio
otel.traces.sampler.arg=1.0

# 日誌配置
otel.logs.exporter=otlp

# JVM 指標啟用
otel.instrumentation.runtime-telemetry.enabled=true
otel.instrumentation.runtime-telemetry-java8.enabled=true

# HTTP 客戶端和伺服器儀表化
otel.instrumentation.http.enabled=true
otel.instrumentation.servlet.enabled=true
otel.instrumentation.spring-webmvc.enabled=true
otel.instrumentation.spring-web.enabled=true

# 資料庫儀表化
otel.instrumentation.jdbc.enabled=true
otel.instrumentation.hibernate.enabled=true
otel.instrumentation.jpa.enabled=true

# Spring Boot 相關儀表化
otel.instrumentation.spring-boot.enabled=true
otel.instrumentation.spring-core.enabled=true
otel.instrumentation.spring-data.enabled=true

# 效能調優 - 指標批次處理
otel.bsp.max.export.batch.size=512
otel.bsp.export.timeout=30000
otel.bsp.schedule.delay=5000
otel.metric.export.batch.size=512
otel.metric.export.batch.timeout=30000

# 記憶體管理
otel.instrumentation.common.experimental.controller-telemetry.enabled=true
otel.instrumentation.experimental.span-suppression-strategy=semconv

# 安全性設定
otel.exporter.otlp.compression=gzip

# 除錯模式（生產環境應設為 false）
otel.javaagent.debug=false