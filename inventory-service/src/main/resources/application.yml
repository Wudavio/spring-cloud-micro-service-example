spring:
  application:
    name: inventory-service
  config:
    import: "optional:configserver:http://config-server:8888"
  cloud:
    config:
      enabled: false  # 暫時禁用 Config Server
      uri: http://config-server:8888
      fail-fast: false
      retry:
        initial-interval: 1000
        max-attempts: 6
        max-interval: 2000
        multiplier: 1.1
  
  # 資料庫配置（Docker: postgres 主機名；本機可覆寫 SPRING_DATASOURCE_JDBC_URL）
  datasource:
    jdbc-url: ${SPRING_DATASOURCE_JDBC_URL:jdbc:postgresql://postgres:5432/inventory_db}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:inventory_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:inventory_pass}}
    driver-class-name: org.postgresql.Driver
      
  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
        
  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

server:
  port: 8082

jwt:
  secret: ${JWT_SECRET}

# DANGER: security.write-guard.enabled=false disables JWT signature checks for inventory
# mutations (Spring Security permits /inventory/**; only InventoryWriteGuardFilter enforces them).
# Never set false outside automated tests.
# security:
#   write-guard:
#     enabled: true

# 日誌配置 - 結構化日誌
logging:
  level:
    com.microservices.inventory: INFO
    org.springframework: WARN
    org.hibernate: WARN
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
  file:
    name: logs/inventory-service.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB

# Eureka 客戶端配置
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# Actuator 配置（自製 logging API 已移除；敏感端點不對外）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# 庫存服務特定配置
inventory:
  # 低庫存告警配置
  low-stock:
    check-interval: 300000  # 5分鐘檢查一次（毫秒）
    alert-enabled: true
  
  # 過期預留清理配置
  cleanup:
    expired-reservations:
      interval: 600000  # 10分鐘清理一次（毫秒）
      enabled: true

# 分散式鎖配置
distributed-lock:
  redis:
    key-prefix: "inventory:lock:"
    default-timeout: 30000  # 30秒超時（毫秒）
    retry-interval: 100     # 重試間隔（毫秒）
    max-retries: 10         # 最大重試次數

# Swagger OpenAPI 配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
  show-actuator: false
