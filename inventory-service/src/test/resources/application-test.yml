spring:
  application:
    name: inventory-service-test
  
  # 測試資料庫配置 - 使用 H2 記憶體資料庫
  datasource:
    jdbc-url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
    
  # JPA 測試配置
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        
  # Redis 測試配置 - 使用嵌入式 Redis
  redis:
    host: localhost
    port: 6379
    database: 1  # 使用不同的資料庫避免衝突
    timeout: 2000ms
        
  # 禁用 Eureka 客戶端
  cloud:
    config:
      enabled: false
      
eureka:
  client:
    enabled: false

# 測試日誌配置
logging:
  level:
    com.microservices.inventory: DEBUG
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO
    org.springframework.data.redis: DEBUG
    
# Actuator 測試配置
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

security:
  write-guard:
    enabled: false

# 測試環境的鎖配置
inventory:
  lock:
    default-lock-timeout-seconds: 5
    default-acquire-timeout-seconds: 2
    retry-interval-millis: 10
    monitoring-enabled: true
    monitoring-log-level: DEBUG
    max-concurrent-locks: 100