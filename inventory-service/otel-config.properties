# OpenTelemetry Java Agent 統一配置檔案
# 此檔案定義了所有微服務的 OpenTelemetry 配置

# 基本服務配置
# OTEL_SERVICE_NAME 將在每個服務的環境變數中單獨設定

# 資源屬性
otel.resource.attributes=deployment.environment=production,service.version=1.0.0,service.namespace=microservices

# 導出器配置
otel.exporter.otlp.endpoint=http://localhost:4317
otel.exporter.otlp.protocol=grpc

# 指標配置
otel.metrics.exporter=otlp
otel.metric.export.interval=30000

# 追蹤配置
otel.traces.exporter=otlp
# 取樣策略：使用 traceidratio 取樣器，取樣率為 100%（開發環境）
otel.traces.sampler=traceidratio
otel.traces.sampler.arg=1.0
# 父級取樣器配置
otel.traces.sampler.parent_based=true

# 日誌配置
otel.logs.exporter=otlp

# JVM 指標啟用
otel.instrumentation.runtime-telemetry.enabled=true
otel.instrumentation.runtime-telemetry-java8.enabled=true

# HTTP 客戶端和伺服器儀表化
otel.instrumentation.http.enabled=true
otel.instrumentation.servlet.enabled=true
otel.instrumentation.spring-webmvc.enabled=true
otel.instrumentation.spring-web.enabled=true

# 資料庫儀表化
otel.instrumentation.jdbc.enabled=true
otel.instrumentation.hibernate.enabled=true
otel.instrumentation.jpa.enabled=true

# Spring Boot 相關儀表化
otel.instrumentation.spring-boot.enabled=true
otel.instrumentation.spring-core.enabled=true
otel.instrumentation.spring-data.enabled=true

# 追蹤批次處理器配置
otel.bsp.max.export.batch.size=512
otel.bsp.export.timeout=30000
otel.bsp.schedule.delay=5000
otel.bsp.max.queue.size=2048

# Span 處理器配置
otel.span.processor.type=batch
otel.span.processor.batch.timeout=30s
otel.span.processor.batch.max.export.batch.size=512

# 追蹤 ID 和 Span ID 格式
otel.traces.id.generator=random

# 跨服務追蹤關聯配置
# 追蹤傳播器配置 - 支援多種傳播格式
otel.propagators=tracecontext,baggage,b3,b3multi,jaeger,ottrace,xray
# 預設使用 W3C Trace Context 和 Baggage
otel.propagators.default=tracecontext,baggage

# HTTP 標頭傳播配置
# 客戶端請求標頭捕獲（用於跨服務追蹤）
otel.instrumentation.http.capture-headers.client.request=traceparent,tracestate,baggage,x-trace-id,x-span-id
# 客戶端響應標頭捕獲
otel.instrumentation.http.capture-headers.client.response=x-trace-id,x-span-id
# 伺服器請求標頭捕獲
otel.instrumentation.http.capture-headers.server.request=traceparent,tracestate,baggage,x-trace-id,x-span-id,user-agent,x-forwarded-for
# 伺服器響應標頭捕獲
otel.instrumentation.http.capture-headers.server.response=x-trace-id,x-span-id

# 服務間通信儀表化
# RestTemplate 儀表化（Spring 服務間調用）
otel.instrumentation.spring-web.enabled=true
otel.instrumentation.resttemplate.enabled=true
# WebClient 儀表化（響應式服務間調用）
otel.instrumentation.spring-webflux.enabled=true
otel.instrumentation.reactor-netty.enabled=true
# OpenFeign 儀表化（聲明式服務間調用）
otel.instrumentation.openfeign.enabled=true
# Apache HttpClient 儀表化
otel.instrumentation.apache-httpclient.enabled=true
# OkHttp 儀表化
otel.instrumentation.okhttp.enabled=true

# 服務發現和負載均衡儀表化
# Eureka 客戶端儀表化
otel.instrumentation.spring-cloud-gateway.enabled=true
# Ribbon 負載均衡儀表化
otel.instrumentation.spring-cloud.enabled=true

# 跨服務追蹤屬性配置
# 對等服務映射（用於識別下游服務）
otel.instrumentation.common.peer-service-mapping=product-service=product-service,order-service=order-service,inventory-service=inventory-service,auth-service=auth-service

# 追蹤上下文注入配置
# 自動注入追蹤上下文到日誌
otel.instrumentation.logback-appender.enabled=true
otel.instrumentation.log4j-appender.enabled=true

# 安全性設定
otel.exporter.otlp.compression=gzip

# 除錯模式（生產環境應設為 false）
otel.javaagent.debug=false

# 錯誤處理配置
otel.instrumentation.common.default-enabled=true

# 跨服務追蹤的額外配置
# 確保所有 HTTP 客戶端都啟用追蹤
otel.instrumentation.http-url-connection.enabled=true
otel.instrumentation.netty.enabled=true
otel.instrumentation.reactor.enabled=true

# 追蹤 Span 屬性配置
# 包含更多的服務間調用資訊
otel.instrumentation.http.known-methods=GET,POST,PUT,DELETE,PATCH,HEAD,OPTIONS,TRACE
otel.instrumentation.http.capture-request-headers=true
otel.instrumentation.http.capture-response-headers=true