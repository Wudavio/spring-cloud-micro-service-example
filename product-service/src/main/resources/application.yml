spring:
  application:
    name: product-service
  config:
    import: "optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://config-server:8888}"
  cloud:
    config:
      enabled: true
      uri: ${SPRING_CLOUD_CONFIG_URI:http://config-server:8888}
      fail-fast: false
      retry:
        initial-interval: 1000
        max-attempts: 6
        max-interval: 2000
        multiplier: 1.1
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/product_db}
    username: ${DB_USERNAME:product_user}
    password: ${DB_PASSWORD:product_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8081

jwt:
  secret: ${JWT_SECRET}

# 日誌配置 - 結構化日誌
logging:
  level:
    com.microservices.product: INFO
    org.springframework: WARN
    org.hibernate: WARN
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
  file:
    name: logs/product-service.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB

# 環境特定配置
---
spring:
  config:
    activate:
      on-profile: development
logging:
  level:
    com.microservices.product: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    io.opentelemetry: DEBUG
    root: DEBUG

---
spring:
  config:
    activate:
      on-profile: testing
logging:
  level:
    com.microservices.product: DEBUG
    org.springframework: INFO
    org.hibernate: INFO
    io.opentelemetry: INFO
    root: INFO

---
spring:
  config:
    activate:
      on-profile: production
logging:
  level:
    com.microservices.product: INFO
    org.springframework: WARN
    org.hibernate: WARN
    io.opentelemetry: WARN
    root: WARN
  file:
    name: /var/log/product-service/product-service.log

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        # 自製 /api/logging 已移除；loggers 僅在內部網路需要時再打開
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    sampling:
      probability: 1.0

# Swagger OpenAPI 配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
  show-actuator: false
