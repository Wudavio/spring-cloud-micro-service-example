services:
  # 基礎設施服務
  postgres:
    restart: "no"
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    restart: "no"
    image: redis:7-alpine
    container_name: redis-cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # LGTM 堆疊－可觀測性基礎設施
  
  # OpenTelemetry Collector－遙測資料收集與路由
  otel-collector:
    restart: "no"
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4327:4327"   # OTLP gRPC receiver
      - "4328:4328"   # OTLP HTTP receiver
      - "8889:8888"   # Prometheus metrics（Collector 自我監控）
      - "13133:13133" # Health check
      - "1777:1777"   # pprof 效能分析
      - "55679:55679" # zPages 內部狀態
    environment:
      - ENVIRONMENT=development
      - GOMEMLIMIT=512MiB
      - GOMAXPROCS=2
    depends_on:
      - mimir
      - tempo
      - loki
    # 官方映像為 distroless，使用程式本身驗證容器可執行狀態
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # 資源限制－避免 Collector 消耗過多資源
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'

  # Mimir－指標儲存（Prometheus 相容）
  mimir:
    restart: "no"
    image: grafana/mimir:latest
    container_name: mimir
    command: ["-config.file=/etc/mimir.yaml"]
    volumes:
      - ./mimir/mimir.yaml:/etc/mimir.yaml
      - mimir_data:/data/mimir
    ports:
      - "9009:9009"   # HTTP API
      - "9095:9095"   # gRPC API
    healthcheck:
      test: ["CMD", "/bin/mimir", "-version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # Tempo－分散式追蹤儲存
  tempo:
    restart: "no"
    image: grafana/tempo:latest
    container_name: tempo
    user: "0"
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml
      - tempo_data:/data/tempo
    ports:
      - "3200:3200"   # HTTP API
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    healthcheck:
      test: ["CMD", "/tempo", "-version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Loki－日誌聚合系統
  loki:
    restart: "no"
    image: grafana/loki:latest
    container_name: loki
    user: "0"
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/local-config.yaml
      - loki_data:/data/loki
    ports:
      - "3100:3100"   # HTTP API
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Grafana－視覺化與儀表板
  grafana:
    restart: "no"
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"   # Web UI
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - mimir
      - tempo
      - loki
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # 微服務
  eureka-server:
    restart: "no"
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      # OpenTelemetry 非阻塞匯出設定
      - OTEL_SERVICE_NAME=eureka-server
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4327
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_TIMEOUT=30000
      - OTEL_EXPORTER_OTLP_COMPRESSION=gzip
      - OTEL_RESOURCE_ATTRIBUTES=service.name=eureka-server,service.version=1.0.0,deployment.environment=production,service.namespace=microservices
      # 批次處理器設定－實作背壓控制
      - OTEL_BSP_SCHEDULE_DELAY=500
      - OTEL_BSP_MAX_QUEUE_SIZE=2048
      - OTEL_BSP_MAX_EXPORT_BATCH_SIZE=512
      - OTEL_BSP_EXPORT_TIMEOUT=30000
      # 取樣設定
      - OTEL_TRACES_SAMPLER=traceidratio
      - OTEL_TRACES_SAMPLER_ARG=1.0
      # 重試與熔斷器設定
      - OTEL_EXPORTER_OTLP_RETRY_ENABLED=true
      - OTEL_EXPORTER_OTLP_RETRY_INITIAL_BACKOFF=1s
      - OTEL_EXPORTER_OTLP_RETRY_MAX_BACKOFF=5s
      - OTEL_EXPORTER_OTLP_RETRY_MAX_ATTEMPTS=3
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  config-server:
    restart: "no"
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      # OpenTelemetry 非阻塞匯出設定
      - OTEL_SERVICE_NAME=config-server
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4327
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_TIMEOUT=30000
      - OTEL_EXPORTER_OTLP_COMPRESSION=gzip
      - OTEL_RESOURCE_ATTRIBUTES=service.name=config-server,service.version=1.0.0,deployment.environment=production,service.namespace=microservices
      # 批次處理器設定－實作背壓控制
      - OTEL_BSP_SCHEDULE_DELAY=500
      - OTEL_BSP_MAX_QUEUE_SIZE=2048
      - OTEL_BSP_MAX_EXPORT_BATCH_SIZE=512
      - OTEL_BSP_EXPORT_TIMEOUT=30000
      # 取樣設定
      - OTEL_TRACES_SAMPLER=traceidratio
      - OTEL_TRACES_SAMPLER_ARG=1.0
      # 重試與熔斷器設定
      - OTEL_EXPORTER_OTLP_RETRY_ENABLED=true
      - OTEL_EXPORTER_OTLP_RETRY_INITIAL_BACKOFF=1s
      - OTEL_EXPORTER_OTLP_RETRY_MAX_BACKOFF=5s
      - OTEL_EXPORTER_OTLP_RETRY_MAX_ATTEMPTS=3
    depends_on:
      eureka-server:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  api-gateway:
    restart: "no"
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      # OpenTelemetry 非阻塞匯出設定
      - OTEL_SERVICE_NAME=api-gateway
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4327
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_TIMEOUT=30000
      - OTEL_EXPORTER_OTLP_COMPRESSION=gzip
      - OTEL_RESOURCE_ATTRIBUTES=service.name=api-gateway,service.version=1.0.0,deployment.environment=production,service.namespace=microservices
      # 批次處理器設定－實作背壓控制
      - OTEL_BSP_SCHEDULE_DELAY=500
      - OTEL_BSP_MAX_QUEUE_SIZE=2048
      - OTEL_BSP_MAX_EXPORT_BATCH_SIZE=512
      - OTEL_BSP_EXPORT_TIMEOUT=30000
      # 取樣設定
      - OTEL_TRACES_SAMPLER=traceidratio
      - OTEL_TRACES_SAMPLER_ARG=1.0
      # 重試與熔斷器設定
      - OTEL_EXPORTER_OTLP_RETRY_ENABLED=true
      - OTEL_EXPORTER_OTLP_RETRY_INITIAL_BACKOFF=1s
      - OTEL_EXPORTER_OTLP_RETRY_MAX_BACKOFF=5s
      - OTEL_EXPORTER_OTLP_RETRY_MAX_ATTEMPTS=3
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  product-service:
    restart: "no"
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product-service
    expose:
      - "8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/product_db
      - SPRING_DATASOURCE_USERNAME=product_user
      - SPRING_DATASOURCE_PASSWORD=product_pass
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - eureka.client.serviceUrl.defaultZone=http://eureka-server:8761/eureka/
      # OpenTelemetry 非阻塞匯出設定
      - OTEL_SERVICE_NAME=product-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4327
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_TIMEOUT=30000
      - OTEL_EXPORTER_OTLP_COMPRESSION=gzip
      - OTEL_RESOURCE_ATTRIBUTES=service.name=product-service,service.version=1.0.0,deployment.environment=production,service.namespace=microservices
      # 批次處理器設定－實作背壓控制
      - OTEL_BSP_SCHEDULE_DELAY=500
      - OTEL_BSP_MAX_QUEUE_SIZE=2048
      - OTEL_BSP_MAX_EXPORT_BATCH_SIZE=512
      - OTEL_BSP_EXPORT_TIMEOUT=30000
      # 取樣設定
      - OTEL_TRACES_SAMPLER=traceidratio
      - OTEL_TRACES_SAMPLER_ARG=1.0
      # 重試與熔斷器設定
      - OTEL_EXPORTER_OTLP_RETRY_ENABLED=true
      - OTEL_EXPORTER_OTLP_RETRY_INITIAL_BACKOFF=1s
      - OTEL_EXPORTER_OTLP_RETRY_MAX_BACKOFF=5s
      - OTEL_EXPORTER_OTLP_RETRY_MAX_ATTEMPTS=3
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  inventory-service:
    restart: "no"
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    container_name: inventory-service
    expose:
      - "8082"
    environment:
      - SPRING_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres:5432/inventory_db
      - SPRING_DATASOURCE_USERNAME=inventory_user
      - SPRING_DATASOURCE_PASSWORD=inventory_pass
      - DB_USERNAME=inventory_user
      - DB_PASSWORD=inventory_pass
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SPRING_REDIS_HOST=redis
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      # OpenTelemetry 非阻塞匯出設定
      - OTEL_SERVICE_NAME=inventory-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4327
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_TIMEOUT=30000
      - OTEL_EXPORTER_OTLP_COMPRESSION=gzip
      - OTEL_RESOURCE_ATTRIBUTES=service.name=inventory-service,service.version=1.0.0,deployment.environment=production,service.namespace=microservices
      # 批次處理器設定－實作背壓控制
      - OTEL_BSP_SCHEDULE_DELAY=500
      - OTEL_BSP_MAX_QUEUE_SIZE=2048
      - OTEL_BSP_MAX_EXPORT_BATCH_SIZE=512
      - OTEL_BSP_EXPORT_TIMEOUT=30000
      # 取樣設定
      - OTEL_TRACES_SAMPLER=traceidratio
      - OTEL_TRACES_SAMPLER_ARG=1.0
      # 重試與熔斷器設定
      - OTEL_EXPORTER_OTLP_RETRY_ENABLED=true
      - OTEL_EXPORTER_OTLP_RETRY_INITIAL_BACKOFF=1s
      - OTEL_EXPORTER_OTLP_RETRY_MAX_BACKOFF=5s
      - OTEL_EXPORTER_OTLP_RETRY_MAX_ATTEMPTS=3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  auth-service:
    restart: "no"
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    expose:
      - "8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/auth_db
      - SPRING_DATASOURCE_USERNAME=auth_user
      - SPRING_DATASOURCE_PASSWORD=auth_pass
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
      # OpenTelemetry 非阻塞匯出設定
      - OTEL_SERVICE_NAME=auth-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4327
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_TIMEOUT=30000
      - OTEL_EXPORTER_OTLP_COMPRESSION=gzip
      - OTEL_RESOURCE_ATTRIBUTES=service.name=auth-service,service.version=1.0.0,deployment.environment=production,service.namespace=microservices
      # 批次處理器設定－實作背壓控制
      - OTEL_BSP_SCHEDULE_DELAY=500
      - OTEL_BSP_MAX_QUEUE_SIZE=2048
      - OTEL_BSP_MAX_EXPORT_BATCH_SIZE=512
      - OTEL_BSP_EXPORT_TIMEOUT=30000
      # 取樣設定
      - OTEL_TRACES_SAMPLER=traceidratio
      - OTEL_TRACES_SAMPLER_ARG=1.0
      # 重試與熔斷器設定
      - OTEL_EXPORTER_OTLP_RETRY_ENABLED=true
      - OTEL_EXPORTER_OTLP_RETRY_INITIAL_BACKOFF=1s
      - OTEL_EXPORTER_OTLP_RETRY_MAX_BACKOFF=5s
      - OTEL_EXPORTER_OTLP_RETRY_MAX_ATTEMPTS=3
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  order-service:
    restart: "no"
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    expose:
      - "8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/order_db
      - SPRING_DATASOURCE_USERNAME=order_user
      - SPRING_DATASOURCE_PASSWORD=order_pass
      - DB_USERNAME=order_user
      - DB_PASSWORD=order_pass
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      # OpenTelemetry 非阻塞匯出設定
      - OTEL_SERVICE_NAME=order-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4327
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_TIMEOUT=30000
      - OTEL_EXPORTER_OTLP_COMPRESSION=gzip
      - OTEL_RESOURCE_ATTRIBUTES=service.name=order-service,service.version=1.0.0,deployment.environment=production,service.namespace=microservices
      # 批次處理器設定－實作背壓控制
      - OTEL_BSP_SCHEDULE_DELAY=500
      - OTEL_BSP_MAX_QUEUE_SIZE=2048
      - OTEL_BSP_MAX_EXPORT_BATCH_SIZE=512
      - OTEL_BSP_EXPORT_TIMEOUT=30000
      # 取樣設定
      - OTEL_TRACES_SAMPLER=traceidratio
      - OTEL_TRACES_SAMPLER_ARG=1.0
      # 重試與熔斷器設定
      - OTEL_EXPORTER_OTLP_RETRY_ENABLED=true
      - OTEL_EXPORTER_OTLP_RETRY_INITIAL_BACKOFF=1s
      - OTEL_EXPORTER_OTLP_RETRY_MAX_BACKOFF=5s
      - OTEL_EXPORTER_OTLP_RETRY_MAX_ATTEMPTS=3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      product-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  postgres_data:
  redis_data:
  # LGTM 堆疊資料卷
  mimir_data:
  tempo_data:
  loki_data:
  grafana_data:
