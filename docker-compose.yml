services:
  # 基礎設施服務
  postgres:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis-cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # LGTM 堆疊 - 可觀測性基礎設施
  
  # OpenTelemetry Collector - 遙測數據收集和路由
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4327:4327"   # OTLP gRPC receiver
      - "4328:4328"   # OTLP HTTP receiver
      - "8889:8888"   # Prometheus metrics (Collector 自監控)
      - "13133:13133" # Health check
      - "1777:1777"   # pprof 效能分析
      - "55679:55679" # zPages 內部狀態
    environment:
      - ENVIRONMENT=development
      - GOMEMLIMIT=512MiB
      - GOMAXPROCS=2
    depends_on:
      - mimir
      - tempo
      - loki
    # 啟用健康檢查
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:13133/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # 資源限制 - 防止 Collector 消耗過多資源
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'

  # Mimir - 指標存儲 (Prometheus 相容)
  mimir:
    image: grafana/mimir:latest
    container_name: mimir
    command: ["-config.file=/etc/mimir.yaml"]
    volumes:
      - ./mimir/mimir.yaml:/etc/mimir.yaml
      - mimir_data:/data/mimir
    ports:
      - "9009:9009"   # HTTP API
      - "9095:9095"   # gRPC API
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9009/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Tempo - 分散式追蹤存儲
  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    user: "0"
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml
      - tempo_data:/data/tempo
    ports:
      - "3200:3200"   # HTTP API
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3200/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Loki - 日誌聚合系統
  loki:
    image: grafana/loki:latest
    container_name: loki
    user: "0"
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/local-config.yaml
      - loki_data:/data/loki
    ports:
      - "3100:3100"   # HTTP API
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Grafana - 視覺化和儀表板
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"   # Web UI
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - mimir
      - tempo
      - loki
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # 微服務
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      # OpenTelemetry 非阻塞導出配置
      - OTEL_SERVICE_NAME=eureka-server
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4327
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_TIMEOUT=30000
      - OTEL_EXPORTER_OTLP_COMPRESSION=gzip
      - OTEL_RESOURCE_ATTRIBUTES=service.name=eureka-server,service.version=1.0.0,deployment.environment=production,service.namespace=microservices
      # 批次處理器配置 - 實作背壓控制
      - OTEL_BSP_SCHEDULE_DELAY=500
      - OTEL_BSP_MAX_QUEUE_SIZE=2048
      - OTEL_BSP_MAX_EXPORT_BATCH_SIZE=512
      - OTEL_BSP_EXPORT_TIMEOUT=30000
      # 取樣配置
      - OTEL_TRACES_SAMPLER=traceidratio
      - OTEL_TRACES_SAMPLER_ARG=1.0
      # 重試和熔斷器配置
      - OTEL_EXPORTER_OTLP_RETRY_ENABLED=true
      - OTEL_EXPORTER_OTLP_RETRY_INITIAL_BACKOFF=1s
      - OTEL_EXPORTER_OTLP_RETRY_MAX_BACKOFF=5s
      - OTEL_EXPORTER_OTLP_RETRY_MAX_ATTEMPTS=3
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      # OpenTelemetry 非阻塞導出配置
      - OTEL_SERVICE_NAME=config-server
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4327
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_TIMEOUT=30000
      - OTEL_EXPORTER_OTLP_COMPRESSION=gzip
      - OTEL_RESOURCE_ATTRIBUTES=service.name=config-server,service.version=1.0.0,deployment.environment=production,service.namespace=microservices
      # 批次處理器配置 - 實作背壓控制
      - OTEL_BSP_SCHEDULE_DELAY=500
      - OTEL_BSP_MAX_QUEUE_SIZE=2048
      - OTEL_BSP_MAX_EXPORT_BATCH_SIZE=512
      - OTEL_BSP_EXPORT_TIMEOUT=30000
      # 取樣配置
      - OTEL_TRACES_SAMPLER=traceidratio
      - OTEL_TRACES_SAMPLER_ARG=1.0
      # 重試和熔斷器配置
      - OTEL_EXPORTER_OTLP_RETRY_ENABLED=true
      - OTEL_EXPORTER_OTLP_RETRY_INITIAL_BACKOFF=1s
      - OTEL_EXPORTER_OTLP_RETRY_MAX_BACKOFF=5s
      - OTEL_EXPORTER_OTLP_RETRY_MAX_ATTEMPTS=3
    depends_on:
      eureka-server:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      # OpenTelemetry 非阻塞導出配置
      - OTEL_SERVICE_NAME=api-gateway
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4327
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_TIMEOUT=30000
      - OTEL_EXPORTER_OTLP_COMPRESSION=gzip
      - OTEL_RESOURCE_ATTRIBUTES=service.name=api-gateway,service.version=1.0.0,deployment.environment=production,service.namespace=microservices
      # 批次處理器配置 - 實作背壓控制
      - OTEL_BSP_SCHEDULE_DELAY=500
      - OTEL_BSP_MAX_QUEUE_SIZE=2048
      - OTEL_BSP_MAX_EXPORT_BATCH_SIZE=512
      - OTEL_BSP_EXPORT_TIMEOUT=30000
      # 取樣配置
      - OTEL_TRACES_SAMPLER=traceidratio
      - OTEL_TRACES_SAMPLER_ARG=1.0
      # 重試和熔斷器配置
      - OTEL_EXPORTER_OTLP_RETRY_ENABLED=true
      - OTEL_EXPORTER_OTLP_RETRY_INITIAL_BACKOFF=1s
      - OTEL_EXPORTER_OTLP_RETRY_MAX_BACKOFF=5s
      - OTEL_EXPORTER_OTLP_RETRY_MAX_ATTEMPTS=3
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/product_db
      - SPRING_DATASOURCE_USERNAME=product_user
      - SPRING_DATASOURCE_PASSWORD=product_pass
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      # OpenTelemetry 非阻塞導出配置
      - OTEL_SERVICE_NAME=product-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4327
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_TIMEOUT=30000
      - OTEL_EXPORTER_OTLP_COMPRESSION=gzip
      - OTEL_RESOURCE_ATTRIBUTES=service.name=product-service,service.version=1.0.0,deployment.environment=production,service.namespace=microservices
      # 批次處理器配置 - 實作背壓控制
      - OTEL_BSP_SCHEDULE_DELAY=500
      - OTEL_BSP_MAX_QUEUE_SIZE=2048
      - OTEL_BSP_MAX_EXPORT_BATCH_SIZE=512
      - OTEL_BSP_EXPORT_TIMEOUT=30000
      # 取樣配置
      - OTEL_TRACES_SAMPLER=traceidratio
      - OTEL_TRACES_SAMPLER_ARG=1.0
      # 重試和熔斷器配置
      - OTEL_EXPORTER_OTLP_RETRY_ENABLED=true
      - OTEL_EXPORTER_OTLP_RETRY_INITIAL_BACKOFF=1s
      - OTEL_EXPORTER_OTLP_RETRY_MAX_BACKOFF=5s
      - OTEL_EXPORTER_OTLP_RETRY_MAX_ATTEMPTS=3
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    container_name: inventory-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres:5432/inventory_db
      - SPRING_DATASOURCE_USERNAME=inventory_user
      - SPRING_DATASOURCE_PASSWORD=inventory_pass
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      # OpenTelemetry 非阻塞導出配置
      - OTEL_SERVICE_NAME=inventory-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4327
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_TIMEOUT=30000
      - OTEL_EXPORTER_OTLP_COMPRESSION=gzip
      - OTEL_RESOURCE_ATTRIBUTES=service.name=inventory-service,service.version=1.0.0,deployment.environment=production,service.namespace=microservices
      # 批次處理器配置 - 實作背壓控制
      - OTEL_BSP_SCHEDULE_DELAY=500
      - OTEL_BSP_MAX_QUEUE_SIZE=2048
      - OTEL_BSP_MAX_EXPORT_BATCH_SIZE=512
      - OTEL_BSP_EXPORT_TIMEOUT=30000
      # 取樣配置
      - OTEL_TRACES_SAMPLER=traceidratio
      - OTEL_TRACES_SAMPLER_ARG=1.0
      # 重試和熔斷器配置
      - OTEL_EXPORTER_OTLP_RETRY_ENABLED=true
      - OTEL_EXPORTER_OTLP_RETRY_INITIAL_BACKOFF=1s
      - OTEL_EXPORTER_OTLP_RETRY_MAX_BACKOFF=5s
      - OTEL_EXPORTER_OTLP_RETRY_MAX_ATTEMPTS=3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/auth_db
      - SPRING_DATASOURCE_USERNAME=auth_user
      - SPRING_DATASOURCE_PASSWORD=auth_pass
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - JWT_SECRET=myVerySecretKeyForJWTTokenGeneration123456789
      - JWT_EXPIRATION=86400000
      # OpenTelemetry 非阻塞導出配置
      - OTEL_SERVICE_NAME=auth-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4327
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_TIMEOUT=30000
      - OTEL_EXPORTER_OTLP_COMPRESSION=gzip
      - OTEL_RESOURCE_ATTRIBUTES=service.name=auth-service,service.version=1.0.0,deployment.environment=production,service.namespace=microservices
      # 批次處理器配置 - 實作背壓控制
      - OTEL_BSP_SCHEDULE_DELAY=500
      - OTEL_BSP_MAX_QUEUE_SIZE=2048
      - OTEL_BSP_MAX_EXPORT_BATCH_SIZE=512
      - OTEL_BSP_EXPORT_TIMEOUT=30000
      # 取樣配置
      - OTEL_TRACES_SAMPLER=traceidratio
      - OTEL_TRACES_SAMPLER_ARG=1.0
      # 重試和熔斷器配置
      - OTEL_EXPORTER_OTLP_RETRY_ENABLED=true
      - OTEL_EXPORTER_OTLP_RETRY_INITIAL_BACKOFF=1s
      - OTEL_EXPORTER_OTLP_RETRY_MAX_BACKOFF=5s
      - OTEL_EXPORTER_OTLP_RETRY_MAX_ATTEMPTS=3
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/order_db
      - SPRING_DATASOURCE_USERNAME=order_user
      - SPRING_DATASOURCE_PASSWORD=order_pass
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      # OpenTelemetry 非阻塞導出配置
      - OTEL_SERVICE_NAME=order-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4327
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_TIMEOUT=30000
      - OTEL_EXPORTER_OTLP_COMPRESSION=gzip
      - OTEL_RESOURCE_ATTRIBUTES=service.name=order-service,service.version=1.0.0,deployment.environment=production,service.namespace=microservices
      # 批次處理器配置 - 實作背壓控制
      - OTEL_BSP_SCHEDULE_DELAY=500
      - OTEL_BSP_MAX_QUEUE_SIZE=2048
      - OTEL_BSP_MAX_EXPORT_BATCH_SIZE=512
      - OTEL_BSP_EXPORT_TIMEOUT=30000
      # 取樣配置
      - OTEL_TRACES_SAMPLER=traceidratio
      - OTEL_TRACES_SAMPLER_ARG=1.0
      # 重試和熔斷器配置
      - OTEL_EXPORTER_OTLP_RETRY_ENABLED=true
      - OTEL_EXPORTER_OTLP_RETRY_INITIAL_BACKOFF=1s
      - OTEL_EXPORTER_OTLP_RETRY_MAX_BACKOFF=5s
      - OTEL_EXPORTER_OTLP_RETRY_MAX_ATTEMPTS=3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      product-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  postgres_data:
  redis_data:
  # LGTM 堆疊數據卷
  mimir_data:
  tempo_data:
  loki_data:
  grafana_data:
