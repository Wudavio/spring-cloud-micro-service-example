spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/order_db
    username: order_user
    password: order_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  redis:
    host: redis
    port: 6379
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

feign:
  client:
    config:
      product-service:
        connect-timeout: 5000
        read-timeout: 5000
      inventory-service:
        connect-timeout: 5000
        read-timeout: 5000

resilience4j:
  retry:
    instances:
      inventory-operations:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.util.concurrent.TimeoutException
          - org.springframework.dao.OptimisticLockingFailureException
