spring:
  application:
    name: order-service-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  redis:
    host: localhost
    port: 6379
    timeout: 2000ms
  cloud:
    config:
      enabled: false

server:
  port: 0

logging:
  level:
    com.microservices.order: DEBUG
    org.springframework.web: DEBUG

# 禁用 Eureka 客戶端
eureka:
  client:
    enabled: false